        <!-- Page 2 of the fan (STRIPE.md §B): the same six colours in the same
             order, but every boundary is now a straight line to a shared apex
             at (800, 1000) — the trails have landed, and the wake reads as a V.
             Its top-edge x-values are exactly page 1's bottom anchors (0,
             145.38, 287.86, 426.79, 561.08, 688.54, 800), so the two sections
             meet across the seam at any window width. Generated by fan.ts's

          aria-hidden="true"
